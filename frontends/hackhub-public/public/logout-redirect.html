<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging out...</title>
    <script type="text/javascript">
        // This script will execute immediately when this page loads.
        // It clears the logout_initiated flag and immediately redirects to the clean login page.

        console.log("logout-redirect.html loaded. Performing immediate redirect.");
        sessionStorage.removeItem('logout_initiated');
        sessionStorage.removeItem('auth_processed');

        // Force hard redirect to the clean login page of your app.
        // window.location.replace is used to prevent going back to this page.
        window.location.replace("http://hackhub.greataihackathon.com/login");
    </script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }
        .spinner-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007bff; /* AWS blue-like color */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner-container">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Logging out, please wait...</p>
    </div>
</body>
</html>
